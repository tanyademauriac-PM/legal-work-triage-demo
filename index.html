<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive product prototype using fictional legal work to explore prioritization, ownership and follow-through before engineering investment.">
  <meta name="color-scheme" content="light">
  <title>Work Triage Prototype | Interactive Product Concept</title>
  <style id="app-styles">
    :root {
      --ink: #1d3041; --muted: #526476; --faint: #738294; --navy: #152c40;
      --accent: #176a6a; --accent-dark: #105456; --accent-soft: #eaf5f2;
      --canvas: #f4f6f8; --line: #dce3e9; --blue: #285d8b; --blue-soft: #edf4fa;
      --amber: #835600; --amber-soft: #fff5dc; --red: #9c3535; --radius: 14px;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink); background: var(--canvas); font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-size: 15px; line-height: 1.5; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button, a, input, textarea, summary { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid #238aab; outline-offset: 3px;
    }
    button:disabled { cursor: default; opacity: .55; }
    a { color: var(--accent-dark); }
    svg { display: inline-block; width: 18px; height: 18px; flex: 0 0 auto; vertical-align: middle; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 28px; line-height: 1.25; font-weight: 650; letter-spacing: -.7px; }
    h2 { font-size: 21px; line-height: 1.35; letter-spacing: -.3px; }
    h3 { font-size: 15px; line-height: 1.4; font-weight: 650; }
    .skip-link { position: fixed; top: -80px; left: 20px; z-index: 20; background: white; padding: 12px 18px; border-radius: 8px; }
    .skip-link:focus { top: 10px; }
    .topbar { background: var(--navy); color: white; }
    .topbar-inner { max-width: 1540px; margin: auto; padding: 0 32px; min-height: 74px; display: flex; align-items: center; gap: 40px; }
    .brand { display: flex; align-items: center; gap: 11px; white-space: nowrap; font-size: 19px; font-weight: 650; letter-spacing: -.3px; }
    .brand-mark { width: 34px; height: 34px; border-radius: 9px; background: #d9eee9; color: #145b59; display: grid; place-items: center; }
    .brand-mark svg { width: 23px; height: 23px; }
    .view-nav { display: flex; align-self: stretch; gap: 24px; }
    .nav-button { border: 0; border-bottom: 3px solid transparent; background: none; color: #c5d3df; padding: 2px 2px 0; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .nav-button[aria-current="page"] { color: white; border-bottom-color: #87c6bb; }
    .topbar-end { margin-left: auto; display: flex; align-items: center; gap: 16px; }
    .persona { display: flex; align-items: center; gap: 9px; font-size: 13px; line-height: 1.35; }
    .avatar { width: 31px; height: 31px; border: 1px solid #60778b; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; }
    .persona small { color: #c2d1dd; display: block; font-size: 11px; }
    .top-reset { color: #e3edf3; border: 1px solid #536b7f; background: transparent; border-radius: 7px; padding: 7px 10px; display: flex; gap: 6px; align-items: center; font-size: 12px; }
    .top-reset:hover { background: #284357; }
    .simulation { border-bottom: 1px solid #dfe5ea; background: #edf1f4; color: #536273; font-size: 12px; }
    .simulation-inner { max-width: 1540px; margin: auto; padding: 8px 32px; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    .simulation strong { font-weight: 650; color: #405366; }
    .simulation-dot { width: 6px; height: 6px; background: #75899b; display: inline-block; border-radius: 50%; margin: 0 7px 1px 0; }
    .page { max-width: 1540px; margin: auto; padding: 25px 32px 32px; }
    .page-heading { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 20px; }
    .page-heading p { color: var(--muted); margin-top: 5px; font-size: 14px; }
    .page-heading .team-key { margin-top: 8px; font-size: 12px; line-height: 1.45; color: #506475; }
    .team-key strong { color: #29465a; font-weight: 650; }
    .guidance-button { display: flex; align-items: center; gap: 7px; color: var(--accent-dark); background: white; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: 13px; white-space: nowrap; }
    .guidance-button:hover { border-color: #8baeb0; }
    .workspace { display: grid; grid-template-columns: minmax(355px, .94fr) minmax(440px, 1.22fr); gap: 22px; align-items: start; }
    .queue, .detail-panel, .operations-panel { background: white; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 2px 5px #152c4003; overflow: hidden; }
    .queue-top { padding: 18px 19px 14px; border-bottom: 1px solid var(--line); }
    .queue-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .queue-title h2 { font-size: 16px; letter-spacing: 0; }
    .scope-note { font-size: 12px; color: var(--muted); }
    .filter-group { display: flex; background: #f0f3f5; padding: 4px; border-radius: 8px; gap: 3px; }
    .filter-button { flex: 1; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 8px 6px; color: var(--muted); font-size: 13px; font-weight: 600; }
    .filter-button[aria-pressed="true"] { color: var(--ink); background: white; border-color: #dfe5e9; box-shadow: 0 1px 3px #18304409; }
    .filter-count { display: inline-block; min-width: 19px; padding: 0 5px; margin-left: 4px; background: #e5eaee; color: #455669; border-radius: 5px; font-size: 11px; }
    .filter-button[aria-pressed="true"] .filter-count { background: var(--accent-soft); color: var(--accent-dark); }

    .priority-label { font-size: 11px; font-weight: 650; display: inline-flex; align-items: center; gap: 5px; color: var(--blue); }
    .priority-label.amber { color: var(--amber); }
    .priority-label.neutral { color: #5e6b79; }
    .priority-label svg { width: 13px; height: 13px; }
    .row-time { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .money-context { font-size: 11px; color: #536878; margin-left: 6px; }
    .status { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 5px; font-size: 11px; line-height: 1.4; font-weight: 600; background: #eef1f5; color: #536274; white-space: nowrap; }
    .status.needs_decision { background: #edf3f8; color: #365a78; }
    .status.requested { background: #f0edf9; color: #66548a; }
    .status.in_progress { background: #eaf3f9; color: #2e6286; }
    .status.waiting { background: #f0f2f5; color: #596879; }
    .status.resolved { background: #e6f3ed; color: #27654c; }
    .status.corrected { background: #f5eee8; color: #765c48; }
    .queue-foot { padding: 12px 19px; border-top: 1px solid var(--line); font-size: 11px; color: #647383; background: #fbfcfd; }
    .detail-panel { max-height: calc(100dvh - 222px); overflow-y: auto; min-height: 550px; }
    .detail-head { padding: 23px 25px 18px; border-bottom: 1px solid #e6ebef; }
    .detail-eyebrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; margin-bottom: 12px; }
    .detail-title { font-size: 23px; line-height: 1.3; margin-bottom: 13px; }
    .detail-tags { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; }

    .panel-content { padding: 20px 25px; }

    .reason-box.amber { border-left-color: #d5ac55; background: #fffaed; }

    .reason-box p { font-size: 13px; color: #43586a; }

    .why-details { margin-top: 8px; font-size: 12px; }

    .evidence-card p { font-size: 13px; color: #455a6c; }

    .next-step { border: 1px solid #e0e8e8; border-radius: 8px; padding: 12px 13px; background: #f8fbfa; font-size: 13px; }
    .next-step .step-title { display: block; font-weight: 600; margin: 4px 0; }
    .next-step .step-meta { display: block; color: var(--muted); font-size: 12px; }
    .next-step.ready { border-color: #b2d4c4; background: #eff8f2; }
    .case-links { display: flex; flex-direction: column; gap: 6px; margin-top: 9px; }
    .case-link { border: 1px solid var(--line); border-radius: 7px; padding: 10px 11px; background: white; color: var(--ink); text-align: left; display: flex; align-items: center; gap: 10px; font-size: 12px; }
    .case-link:hover { background: #f4f8fa; }

    .activity-details summary { font-size: 13px; font-weight: 600; cursor: pointer; }
    .activity-list { padding: 0; margin: 12px 0 0; list-style: none; }
    .activity-list li { position: relative; padding: 0 0 16px 17px; border-left: 1px solid #dbe4e9; font-size: 12px; }
    .activity-list li::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #7b969f; position: absolute; left: -3.5px; top: 6px; }
    .activity-list li:last-child { padding-bottom: 0; }
    .activity-meta { color: var(--muted); font-size: 10px; margin-bottom: 4px; }
    .activity-note { margin-top: 5px; padding: 6px 8px; background: #f4f7f9; border-radius: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .action-footer { padding: 16px 25px 18px; border-top: 1px solid var(--line); background: #fbfdfd; position: sticky; bottom: 0; z-index: 2; box-shadow: 0 -5px 12px #18304404; }
    .action-footer .action-caption { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
    .action-buttons { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .button { display: inline-flex; justify-content: center; align-items: center; gap: 7px; padding: 10px 13px; border: 1px solid #cfdce1; border-radius: 7px; background: white; color: #354e61; font-size: 13px; font-weight: 600; min-height: 40px; }
    .button:hover { background: #f1f6f7; }
    .button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .button.primary:hover { background: var(--accent-dark); }
    .text-button { display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; color: #516a7b; font-size: 12px; padding: 7px 4px; text-decoration: underline; text-underline-offset: 3px; }
    .closed-note { padding: 12px 13px; border: 1px solid #c7dfd1; border-radius: 8px; background: #f0f8f3; font-size: 13px; color: #2f6250; margin-bottom: 17px; }
    .closed-note.corrected { background: #faf5ef; color: #735a43; border-color: #e7d7c5; }
    .empty-state { text-align: center; padding: 58px 26px; color: var(--muted); }
    .empty-state .empty-icon { width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
    .empty-state h3 { color: var(--ink); margin-bottom: 7px; font-size: 16px; }
    .empty-state p { font-size: 13px; margin-bottom: 16px; }
    .mobile-back { display: none; }
    #live-status { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #173b3f; color: white; padding: 13px 18px; border-radius: 9px; box-shadow: 0 7px 24px #132c4029; font-size: 13px; z-index: 10; max-width: min(600px, calc(100% - 32px)); width: max-content; }
    #live-status:empty { display: none; }
    dialog { border: 1px solid #dbe3e8; padding: 0; border-radius: 15px; width: min(550px, calc(100% - 32px)); max-height: calc(100dvh - 40px); color: var(--ink); box-shadow: 0 18px 70px #142c4033; }
    dialog::backdrop { background: #122c4073; backdrop-filter: blur(2px); }
    .dialog-head { padding: 22px 24px 17px; display: flex; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); }
    .dialog-head h2 { font-size: 21px; }

    .icon-button { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--line); background: white; color: var(--muted); flex-shrink: 0; }
    .dialog-body { padding: 20px 24px; }
    .dialog-intro { color: #4c6072; font-size: 13px; margin-bottom: 18px; }
    .form-field { margin-bottom: 17px; }
    .form-field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .form-field textarea, .form-field input { display: block; width: 100%; border: 1px solid #bdcdd7; border-radius: 7px; padding: 10px 11px; font-size: 14px; color: var(--ink); background: white; }

    .assumption { font-size: 11px; color: #6b7d8b; margin-top: 12px; }

    .ops-group-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 19px 8px; background: #f8fafc; border-bottom: 1px solid #e7edf1; border-top: 1px solid #e7edf1; font-size: 12px; font-weight: 650; }

    .ops-row { padding-top: 13px; padding-bottom: 13px; }

      .brand { font-size: 17px; } .brand-mark { width: 29px; height: 29px; }

  }
  function requireReview(value, now) {

      need.title = 'Client callback completed and recorded';
      need.resolvedAt = state.now;
      caseRecord.steps[need.stepKey].status = 'Callback recorded as complete';
      caseRecord.steps[need.stepKey].complete = true;
      text = 'Recorded a completed fictional callback. The separate document dependency is unchanged.';
      message = 'Callback outcome recorded. Client Avery’s separate document dependency remains open.';

      note = requireText(fields.note, 'Follow-up outcome');
      const reviewAt = requireReview(fields.reviewAt, state.now);
      if (fields.referenceSupplied !== true) throw new Error('Confirm that the reference was supplied in this fictional scenario.');

      need.title = 'Provider processing confirmation is pending';
      need.disposition = 'waiting';
      need.waitingOn = 'External provider';
      need.waitingReason = 'Reference supplied; awaiting confirmation that processing can proceed.';
      need.significance = 'The reference has been supplied. Provider processing is not confirmed; review the response at the recorded follow-up point.';
      need.actionOwner = null;
      need.reviewAt = reviewAt;
      need.followUpOwner = CURRENT_USER.name;

      need.evidence.push(evidence('reference-supplied', 'Recorded fictional follow-up', state.now, 'Case manager Alex Rivera recorded supplying ' + caseRecord.reference + '. Provider confirmation is still pending.', 'Updated'));
      text = 'Recorded supplying the reference. The request remains waiting for provider confirmation, with a follow-up point.';
      message = 'Follow-up recorded. Provider confirmation remains outstanding.';
    } else if (['record_wait', 'update_followup'].includes(action)) {
      note = requireText(fields.note, 'Waiting or follow-up reason');
      need.reviewAt = requireReview(fields.reviewAt, state.now);
      need.followUpOwner = CURRENT_USER.name;
      need.waitingReason = note;
      if (need.disposition !== 'requested') need.disposition = 'waiting';
      text = need.disposition === 'requested' ? 'Updated follow-up for the review request. Acceptance remains pending.' : 'Recorded a waiting condition and a follow-up point. Any unresolved recorded commitment remains in force.';
      message = needsAttention(need, state.now) ? 'Follow-up recorded. The unresolved commitment keeps this need in Needs attention.' : 'Follow-up recorded. This need remains available in All tracked.';
    } else if (action === 'correct_signal') {
      note = requireText(fields.note, 'Correction reason');
      need.disposition = 'corrected';
      need.correctedAt = state.now;
      need.correctionReason = note;
      text = 'Corrected the attention signal. This is not recorded as completed work; underlying tasks and professional decisions are unchanged.';
      message = 'Signal corrected and retained in All tracked. No underlying task was completed.';

  function openGuidance() {
    activeAction = null;
    showDialog(dialogHead('How priority guidance works', 'Provisional rules for this fictional demonstration') + '<div class="dialog-body guidance-copy"><p>The suggested order helps compare work. You can inspect any item, and the underlying records remain available.</p><ol><li><strong>Time-sensitive commitments and follow-up points that have arrived come first.</strong> The recorded time determines their order. A future follow-up does not erase an unfulfilled commitment.</li><li><strong>Conditions blocking an identified next step follow.</strong> Conflicting evidence is labeled for verification. Within a group, the earlier recorded review point or signal comes first.</li><li><strong>Other operational work remains visible.</strong> Waiting, requested, and accepted work appears in All tracked. It returns to attention when its review point arrives.</li></ol><p><strong>Importance, attention now, and disposition are separate.</strong> Requesting an attorney review does not reduce its consequence or imply acceptance.</p><p>Case estimates are fictional context. There is no financial weighting or numerical priority score.</p><p>All timestamps use the fixed Eastern demo clock. These rules are assumptions for exploration, not an organization’s operating policy or legal guidance.</p></div><div class="dialog-footer"><button class="button primary" data-close="true">Got it</button></div>');
  }
  function openReset() {
    activeAction = { action: 'reset' };
    showDialog('<form id="action-form">' + dialogHead('Reset the fictional demo?') + '<div class="dialog-body"><p class="dialog-intro">Restore the original six cases and seven attention needs. Changes and activity recorded during this session will be cleared.</p></div><div class="dialog-footer"><button type="button" class="button" data-close="true">Keep current state</button><button class="button primary" type="submit">Reset demo</button></div></form>');
  }
  app.addEventListener('click', event => {
    const target = event.target.closest('button');
    if (!target) return;
    if (target.dataset.select) {
      selectedId = target.dataset.select; mobileDetail = true;
      render(window.matchMedia('(max-width: 820px)').matches ? 'detail-title' : null);
    } else if (target.dataset.filter) {
      filter = target.dataset.filter;
      const rows = C.sortedNeeds(state, filter);
      if (!rows.some(n => n.id === selectedId)) selectedId = rows[0]?.id || null;
      mobileDetail = false; render();
    } else if (target.dataset.view) {
      view = target.dataset.view; mobileDetail = false; render();
    } else if (target.dataset.action) openAction(target.dataset.need, target.dataset.action);
    else if (target.dataset.guidance) openGuidance();
    else if (target.dataset.reset) openReset();
    else if (target.dataset.back) {
      mobileDetail = false; render();
      requestAnimationFrame(() => document.querySelector('[data-focus-key="need-' + selectedId + '"]')?.focus({ preventScroll: true }));
    }
  });
  dialog.addEventListener('click', event => { if (event.target.closest('[data-close]')) dialog.close(); });
  dialog.addEventListener('close', () => { activeAction = null; });
  dialog.addEventListener('submit', event => {
    event.preventDefault();
    if (!activeAction) return;
    if (activeAction.action === 'reset') {
      state = C.createInitialState(); filter = 'attention'; view = 'work'; selectedId = 'callback'; mobileDetail = false;
      dialog.close(); render('workspace-heading'); announce('Demo reset. All seven original attention needs are restored.'); return;
    }
    const values = new FormData(event.target);
    const fields = { note: values.get('note') || '', reviewAt: values.get('reviewAt') || '',
      receiptVerified: values.has('receiptVerified'), completed: values.has('completed'), referenceSupplied: values.has('referenceSupplied') };
    try {
      const result = C.applyAction(state, activeAction.needId, activeAction.action, fields);
      state = result.state;
      dialog.close(); render('detail-title'); announce(result.message);
    } catch (error) {
      const errorElement = document.getElementById('form-error');
      errorElement.textContent = error.message;
      errorElement.setAttribute('tabindex', '-1'); errorElement.focus();
    }
  });
  render();
})();
</script>
</body>
</html>
